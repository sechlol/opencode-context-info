name: Publish

# Publishes to npm when a version tag (e.g. v0.1.0) is pushed.
# Requires an NPM_TOKEN repository secret with publish rights, or an npm
# trusted publisher configured for this repository and workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run check
      # `prepack` re-runs the checks before the tarball is built.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
