name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    semver-increment: minor
    when:
      labels:
        - feature
        - enhancement
  - title: "🐛 Fixes"
    semver-increment: patch
    when:
      labels:
        - fix
        - bug
  - title: "🧰 Maintenance"
    semver-increment: patch
    when:
      labels:
        - chore
        - dependencies
        - documentation
  - type: pre-exclude
    when:
      label: skip-changelog
  - type: version-resolver
    semver-increment: major
    when:
      label: major
  - type: version-resolver
    semver-increment: patch

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
no-changes-template: "* No pull requests in this release. See the commit history or CHANGELOG.md."

template: |
  ## Changes

  $CHANGES
